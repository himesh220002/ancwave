name: Deploy ancwave to AWS Lambda & CloudFront (Scale-to-Zero)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ancwave-live-app
  LAMBDA_FUNCTION_NAME: ancwave-live-app
  CLOUDFRONT_DISTRIBUTION_ID: E1GFGU80FWV7ZM

jobs:
  deploy:
    name: Build, Push & Deploy to Serverless Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ECR (Single-Arch Manifest for AWS Lambda)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/aws/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Update AWS Lambda Function Code
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --image-uri $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --region $AWS_REGION
          aws lambda wait function-updated \
            --function-name $LAMBDA_FUNCTION_NAME \
            --region $AWS_REGION
          echo "✅ Lambda function successfully updated with new container image!"

      - name: Invalidate CloudFront Edge CDN
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"
          echo "✅ Edge CDN Cache Invalidation triggered!"
